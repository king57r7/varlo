name: Generate Release Keystore (run once)
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (اسم المفتاح، مثلاً varlo-key)"
        required: true
        default: "varlo-key"
      store_password:
        description: "Keystore password (احفظه بمكان آمن)"
        required: true
      key_password:
        description: "Key password (ممكن نفس قيمة store_password)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Varlo, OU=Varlo, O=Varlo, L=Damascus, ST=Damascus, C=SY"

      - name: Base64-encode keystore
        run: base64 -w 0 release.keystore.jks > release.keystore.base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore.jks
            release.keystore.base64.txt
          retention-days: 7
